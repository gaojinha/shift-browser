<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>世界导航</title>
<meta name="description" content="32 大类 721 个站点的离线导航页，按类别浏览、搜索与收藏。">
<style>
  /* Hallmark Floor: tokens only, 4px scale, contrast >= 4.5 */
  :root {
    --bg: #12151c;
    --bg-elev: #1a1f29;
    --bg-elev-2: #232935;
    --border: #2a3140;
    --border-strong: #3a4453;
    --fg: #e6e8eb;
    --muted: #9aa0a6;
    --accent: #4a9eff;
    --accent-fg: #0b1220;
    --star: #f5a623;
    --modal-bg: #1e2a45;
    --input-bg: #0f1319;
    --scrim: rgba(0, 0, 0, 0.55);
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 20px;
    --sp-6: 24px;
    --r-sm: 8px;
    --r-md: 12px;
    --font-sans: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow-x: clip; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 var(--font-sans);
    display: flex; flex-direction: column;
    border-radius: var(--r-md);
  }
  .nav-header {
    display: flex; align-items: center; gap: var(--sp-4);
    padding: var(--sp-3) var(--sp-5);
    background: var(--bg-elev); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .nav-title { font-size: 17px; font-weight: 600; white-space: nowrap; }
  .nav-title a {
    color: var(--muted); text-decoration: none; font-size: 13px;
    margin-left: var(--sp-3);
  }
  .nav-title a:hover { color: var(--fg); }
  .nav-title a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav-search { flex: 1; max-width: 420px; }
  .nav-search input {
    width: 100%; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: var(--r-sm); color: var(--fg);
    padding: var(--sp-2) var(--sp-3); font-size: 14px; outline: none;
  }
  .nav-search input:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
  .layout { flex: 1; display: flex; overflow: hidden; }
  .cat-tabs {
    width: 160px; overflow-y: auto; background: var(--bg-elev);
    border-right: 1px solid var(--border); flex-shrink: 0; padding: var(--sp-2);
  }
  .cat-tab {
    display: flex; align-items: center; gap: var(--sp-2); width: 100%;
    padding: var(--sp-2) var(--sp-3); border: none; background: transparent;
    color: var(--fg); border-radius: var(--r-sm); cursor: pointer;
    font-size: 13px; text-align: left; margin-bottom: var(--sp-1);
    transition: background 120ms ease;
  }
  .cat-tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-tab:hover { background: var(--bg-elev-2); }
  .cat-tab:active { background: var(--border); }
  .cat-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cat-tab.active { background: var(--accent); color: var(--accent-fg); }
  .main { flex: 1; overflow-y: auto; padding: var(--sp-5) var(--sp-6); }
  .cat-header { margin-bottom: var(--sp-4); }
  .cat-header .ch-icon { font-size: 20px; margin-right: var(--sp-2); }
  .cat-header .ch-title { font-size: 18px; font-weight: 600; }
  .cat-header .ch-desc { color: var(--muted); font-size: 13px; margin-top: var(--sp-1); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--sp-3); }
  .site-card {
    position: relative; background: var(--bg-elev); color: var(--fg); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: var(--sp-4); cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .site-card:hover { border-color: var(--accent); background: var(--bg-elev-2); }
  .site-card:active { background: var(--border); }
  .site-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sc-icon { font-size: 24px; margin-bottom: var(--sp-2); }
  .sc-name { font-size: 14px; font-weight: 600; margin-bottom: var(--sp-1); }
  .sc-desc {
    font-size: 12px; color: var(--muted); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; margin-bottom: var(--sp-2);
  }
  .sc-rating { display: flex; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-1); }
  .stars { position: relative; display: inline-block; font-size: 12px; line-height: 1; }
  .stars-bg { color: var(--border-strong); }
  .stars-fill { position: absolute; left: 0; top: 0; color: var(--star); overflow: hidden; white-space: nowrap; }
  .rating-num { font-size: 12px; color: var(--muted); }
  .sc-meta { font-size: 12px; color: var(--muted); }
  .sc-star {
    position: absolute; top: var(--sp-2); right: var(--sp-2);
    border: none; background: transparent; color: var(--muted);
    font-size: 16px; cursor: pointer; padding: var(--sp-1);
  }
  .sc-star:hover { color: var(--star); }
  .sc-star:active { transform: scale(0.92); }
  .sc-star:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sc-star.faved { color: var(--star); }
  .sc-remove {
    position: absolute; top: var(--sp-2); right: var(--sp-6);
    border: none; background: transparent; color: var(--muted);
    font-size: 13px; cursor: pointer; display: none; padding: var(--sp-1);
  }
  .site-card:hover .sc-remove { display: block; }
  .empty { color: var(--muted); text-align: center; padding: var(--sp-8) 0; }
  .add-fav-btn {
    margin-bottom: var(--sp-4); background: var(--bg-elev-2); color: var(--accent);
    border: 1px dashed var(--accent); border-radius: var(--r-sm);
    padding: var(--sp-2) var(--sp-4); cursor: pointer; font-size: 13px;
  }
  .add-fav-btn:active { background: var(--border); }
  .add-fav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .modal-mask {
    display: none; position: fixed; inset: 0; background: var(--scrim);
    z-index: 50; align-items: center; justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal-box {
    width: 360px; background: var(--modal-bg); border: 1px solid var(--border-strong);
    border-radius: var(--r-md); padding: var(--sp-5);
  }
  .modal-box h3 { font-size: 15px; margin-bottom: var(--sp-3); }
  .modal-box input {
    width: 100%; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: var(--r-sm); color: var(--fg);
    padding: var(--sp-2) var(--sp-3); font-size: 14px;
    margin-bottom: var(--sp-3); outline: none;
  }
  .modal-box input:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: var(--sp-2); }
  .modal-btn {
    border: none; border-radius: var(--r-sm); padding: var(--sp-2) var(--sp-4);
    cursor: pointer; font-size: 13px;
  }
  .modal-btn.cancel { background: var(--bg-elev-2); color: var(--fg); }
  .modal-btn.cancel:active { background: var(--border); }
  .modal-btn.ok { background: var(--accent); color: var(--accent-fg); }
  .modal-btn.ok:active { background: var(--accent-strong, var(--accent)); }
  .modal-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .modal-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  @media (prefers-reduced-motion: reduce) {
    .cat-tab, .site-card { transition: none; }
  }
</style>
</head>
<body>
  <div class="nav-header">
    <div class="nav-title">世界导航 <a href="index.html">返回新标签页</a></div>
    <div class="nav-search"><input id="searchInput" placeholder="搜索 721 个网站（名称 / 描述 / 域名）" autocomplete="off" spellcheck="false"></div>
  </div>
  <div class="layout">
    <div class="cat-tabs" id="catTabs"></div>
    <div class="main" id="main"></div>
  </div>
  <div class="modal-mask" id="favModal">
    <div class="modal-box">
      <h3>添加收藏</h3>
      <input id="favName" placeholder="名称（如：永济政府网）">
      <input id="favUrl" placeholder="网址（https://...）">
      <input id="favIcon" placeholder="图标（可选）">
      <div class="modal-actions">
        <button class="modal-btn cancel" id="favCancel">取消</button>
        <button class="modal-btn ok" id="favOk">添加</button>
      </div>
    </div>
  </div>
<script>
(function() {
  var CATS = __WORLDAV_DATA__;
  // ---- 用户收藏（localStorage，与启动页共享）----
  function loadUserFavs() { try { return JSON.parse(localStorage.getItem('sb_user_favs') || '[]'); } catch(e) { return []; } }
  function saveUserFavs(f) { localStorage.setItem('sb_user_favs', JSON.stringify(f)); }
  function isFaved(url) { return loadUserFavs().some(function(x) { return x.url === url; }); }

  var current = CATS[0].id;
  var keyword = '';

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\\/g,'&#92;'); }

  function renderTabs() {
    document.getElementById('catTabs').innerHTML = CATS.map(function(c) {
      return '<button class="cat-tab' + (c.id === current ? ' active' : '') + '" data-cat="' + c.id + '">' + esc(c.icon) + '<span>' + esc(c.title) + '</span></button>';
    }).join('');
  }

  function cardHtml(s, isUser) {
    var pct = s.r ? Math.round((parseFloat(s.r) / 5) * 100) : 0;
    var fav = isUser || s.d === '我的收藏';
    return '<div class="site-card" data-url="' + esc(s.u) + '">' +
      '<div class="sc-icon">' + esc(s.i || '🔗') + '</div>' +
      '<div class="sc-name">' + esc(s.n) + '</div>' +
      '<div class="sc-desc">' + esc(s.d || s.u) + '</div>' +
      (fav ? '' : '<div class="sc-rating"><span class="stars"><span class="stars-bg">★★★★★</span><span class="stars-fill" style="width:' + pct + '%">★★★★★</span></span><span class="rating-num">' + esc(s.r) + '</span></div>') +
      '<div class="sc-meta">' + (fav ? '⭐ 我的收藏' : '👥 ' + esc(s.us) + ' · ⚡ ' + esc(s.sp)) + '</div>' +
      (fav ? '<button class="sc-remove" data-url="' + esc(s.u) + '" title="移除收藏">✕</button>' : '') +
      '<button class="sc-star' + (isFaved(s.u) ? ' faved' : '') + '" data-url="' + esc(s.u) + '" data-name="' + esc(s.n) + '" data-icon="' + esc(s.i || '🔗') + '" title="收藏到快捷访问">' + (isFaved(s.u) ? '★' : '☆') + '</button>' +
      '</div>';
  }

  function renderMain() {
    var main = document.getElementById('main');
    var cat = CATS.find(function(c) { return c.id === current; });
    if (!cat) return;
    var sites = cat.sites.slice();
    if (cat.id === 'favorites') {
      var userFavs = loadUserFavs().map(function(f) { return { n: f.name, u: f.url, d: '我的收藏', i: f.icon || '⭐' }; });
      sites = userFavs.concat(sites);
    }
    if (keyword) {
      var k = keyword.toLowerCase();
      sites = sites.filter(function(s) {
        return (s.n + ' ' + (s.d||'') + ' ' + s.u).toLowerCase().indexOf(k) !== -1;
      });
    }
    var h = '';
    if (cat.id === 'favorites') h += '<button class="add-fav-btn" id="addFavBtn">＋ 添加收藏</button>';
    h += '<div class="cat-header"><span class="ch-icon">' + cat.icon + '</span><span class="ch-title">' + esc(cat.title) + '</span><div class="ch-desc">' + esc(cat.desc) + '</div></div>';
    h += sites.length ? '<div class="cards">' + sites.map(function(s) { return cardHtml(s, s.d === '我的收藏'); }).join('') + '</div>' : '<div class="empty">没有匹配的网站</div>';
    main.innerHTML = h;
    main.scrollTop = 0;
  }

  document.getElementById('catTabs').addEventListener('click', function(e) {
    var btn = e.target.closest('.cat-tab');
    if (!btn) return;
    current = btn.dataset.cat;
    renderTabs(); renderMain();
  });
  document.getElementById('searchInput').addEventListener('input', function(e) {
    keyword = e.target.value.trim();
    renderMain();
  });
  document.getElementById('main').addEventListener('click', function(e) {
    var star = e.target.closest('.sc-star');
    if (star) {
      e.stopPropagation();
      var favs = loadUserFavs();
      var url = star.dataset.url;
      var idx = favs.findIndex(function(f) { return f.url === url; });
      if (idx >= 0) { favs.splice(idx, 1); }
      else { favs.unshift({ name: star.dataset.name, url: url, icon: star.dataset.icon }); }
      saveUserFavs(favs);
      renderMain();
      return;
    }
    var rm = e.target.closest('.sc-remove');
    if (rm) {
      e.stopPropagation();
      var favs2 = loadUserFavs().filter(function(f) { return f.url !== rm.dataset.url; });
      saveUserFavs(favs2);
      renderMain();
      return;
    }
    if (e.target.id === 'addFavBtn') {
      document.getElementById('favModal').classList.add('show');
      document.getElementById('favName').focus();
      return;
    }
    var card = e.target.closest('.site-card');
    if (card) window.open(card.dataset.url, '_blank');
  });
  document.getElementById('favCancel').addEventListener('click', function() {
    document.getElementById('favModal').classList.remove('show');
  });
  document.getElementById('favOk').addEventListener('click', function() {
    var n = document.getElementById('favName').value.trim();
    var u = document.getElementById('favUrl').value.trim();
    var i = document.getElementById('favIcon').value.trim();
    if (!n || !u) return;
    if (!/^https?:\/\//.test(u)) u = 'https://' + u;
    var favs = loadUserFavs();
    favs.unshift({ name: n, url: u, icon: i || '⭐' });
    saveUserFavs(favs);
    document.getElementById('favModal').classList.remove('show');
    document.getElementById('favName').value = '';
    document.getElementById('favUrl').value = '';
    document.getElementById('favIcon').value = '';
    current = 'favorites';
    renderTabs(); renderMain();
  });

  renderTabs();
  renderMain();
})();
</script>
</body>
</html>
