[package]
name = "shift-browser"
# 2026-09-22（打包收口）：本 crate 同时产出主浏览器 + shift-browser-mcp 两个 bin；
# tauri CLI 打 bundle 时必须知道哪个是主程序 → 显式点名，避免 "failed to find main binary"
default-run = "shift-browser"
version = "5.8.3"
description = "Shift Browser - AI 增强型浏览器（Tauri 重构版）"
authors = ["OpenClaw Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gaojinha/shift-browser"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "shift_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# MCP Server（阶段 4 · 开放生态）：把本地开放 API 暴露为标准 MCP 工具，
# 供任何 MCP 客户端（opencode / Claude Desktop 等）驱动浏览器。
# 编译：cargo build --release --bin shift-browser-mcp；安装：cp 到 ~/.local/bin/（见 docs/local-api.md）
[[bin]]
name = "shift-browser-mcp"
path = "src/bin/mcp_server.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
# 模糊测试支撑（HANDOFF P2-5）：仅暴露手写解析器的跨 crate 驱动入口给 fuzz/ crate，
# 生产构建不启用。解析器本体保持私有，见 api::fuzz_helpers
fuzz = []

[dependencies]
async-trait = "0.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# ── tauri unstable 特性登记（HANDOFF P2-4）────────────────────────────
# 仅使用两个不稳定 API（Linux/WebKitGTK 平台能力，稳定 API 无替代）：
#   1. WebviewWindow::with_webview() —— 23 处：拿底层 webkit2gtk::WebView，
#      用于内容过滤/IPC 注入/截图/翻译/导航控制/代理设置/权限提示等
#   2. Window::gtk_window() —— 5 处：拿 gtk::Window 做父子窗口/几何/置顶
# 分布文件：tabs.rs、tabs/commands.rs、extensions.rs、extensions/privacy.rs、
#   tls.rs、engine/layout.rs、content_cmd.rs、agent_cmd.rs、api.rs、lib.rs
# 每升级 tauri 版本必须复核：grep -rn "\.with_webview(\|\.gtk_window()" src
# 若 API 稳定化则移除 unstable feature；签名变更则逐处适配。
tauri = { version = "2.11.3", features = ["unstable", "custom-protocol"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# 单实例（阶段 4 D3）：已有实例运行时，新实例退出并把命令行参数转发给已有实例
tauri-plugin-single-instance = "2"
# default-features = false：只用 SQLite + tokio，关掉默认带入的 mysql/postgres 驱动
# 及其 rustls/rsa（RUSTSEC-2023-0071）TLS 栈；无 compile-time query!/FromRow，无需 macros
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
# 用户账号密码哈希（PBKDF2，与原版 Electron 一致：10 万次迭代 SHA-512）
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
# 主密码 NFKC 归一化（全角/兼容字符在设置与解锁两侧得到同一密码）
unicode-normalization = "0.1"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
# 流式读取（feed.rs 响应体边读边计数，防内存炸弹）
futures-util = "0.3"
thiserror = "2"
# 仅 async：HANDOFF P2-4 审计确认全仓无 reqwest::blocking 使用点，blocking feature 已移除
# （blocking 会额外拉入同步 client 及其 hyper/tokio 依赖面，误用还会在异步运行时内阻塞线程）
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
# 关掉 default 的 reqwest feature：我们只用 extract(HTML) 解析，抓取走自己的
# async reqwest 0.12（reader.rs）；该 feature 会额外带入 reqwest 0.11 + h2 0.3（RUSTSEC-2026-0258）
readability = { version = "0.3.0", default-features = false }
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }
# HTML 净化（阅读模式正文防 XSS）：基于 html5ever 真解析器，白名单模式，
# 替代原正则方案（正则可被 <svg/onload=> 等无闭合写法绕过）
ammonia = "4"
# readability 正文 HTML 转纯文本：用 HTML5 DOM 保留段落、标题和列表边界。
html5ever = "0.26"
markup5ever_rcdom = "0.2"
# URL 解析（ai.rs SSRF 防护：校验 base_url 协议/主机）
url = "2"
# 系统文件对话框（XDG portal，走 DBus，不依赖 GTK 主线程）
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
ksni = "0.3"
ts-rs = "10.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "=2.0", features = ["v2_40"] }
# 证书管理（P1-P3）：GTlsCertificate 的 subject_name/dns_names/ip_addresses/
# not_valid_before/after 都要 glib 2.70+（系统 glib 2.86），显式开 v2_70 特性
gio = { version = "0.18", features = ["v2_70"] }
# 网页截图（开放 API screenshot 命令）：webkit snapshot 返回 cairo::Surface；
# 写 PNG 需 cairo-rs 的 png feature（gtk 默认没开）
cairo-rs = { version = "0.18", features = ["png"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
# 注意：不能 strip = true！Tauri 2 的 web extension（cdylib）需要保留符号，
# 否则 WebKit 找不到入口函数，tauri://localhost 协议失效，前端加载失败
strip = "debuginfo"
# R4-8 决策（2026-10-14）：从 opt-level="s"+fat-LTO 切到 3+thin-LTO。
# 依据：bench_3_thin 基准跑分与 bench_s_lto 性能基本持平，构建时间显著更短；
# Tauri 2 cdylib 保留符号（strip="debuginfo"）要求不变。

# === R4-8 基准 profile（仅用于基准跑分，不改现行 release）===
[profile.bench_s_lto]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.bench_z_lto]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.bench_3_lto]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.bench_3_thin]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
