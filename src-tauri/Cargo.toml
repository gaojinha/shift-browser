[package]
name = "shift-browser"
version = "5.5.0"
description = "Shift Browser - AI 增强型浏览器（Tauri 重构版）"
authors = ["OpenClaw Team"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "shift_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["unstable", "custom-protocol"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
readability = "0.3.0"
regex = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "=2.0", features = ["v2_40"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# 注意：不能 strip = true！Tauri 2 的 web extension（cdylib）需要保留符号，
# 否则 WebKit 找不到入口函数，tauri://localhost 协议失效，前端加载失败
strip = "debuginfo"
