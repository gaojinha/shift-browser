[package]
name = "shift-browser"
# 2026-09-22（打包收口）：本 crate 同时产出主浏览器 + shift-browser-mcp 两个 bin；
# tauri CLI 打 bundle 时必须知道哪个是主程序 → 显式点名，避免 "failed to find main binary"
default-run = "shift-browser"
version = "5.7.0"
description = "Shift Browser - AI 增强型浏览器（Tauri 重构版）"
authors = ["OpenClaw Team"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "shift_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# MCP Server（阶段 4 · 开放生态）：把本地开放 API 暴露为标准 MCP 工具，
# 供任何 MCP 客户端（opencode / Claude Desktop 等）驱动浏览器。
# 编译：cargo build --release --bin shift-browser-mcp；安装：cp 到 ~/.local/bin/（见 docs/local-api.md）
[[bin]]
name = "shift-browser-mcp"
path = "src/bin/mcp_server.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
async-trait = "0.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["unstable", "custom-protocol"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# 单实例（阶段 4 D3）：已有实例运行时，新实例退出并把命令行参数转发给已有实例
tauri-plugin-single-instance = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
# 用户账号密码哈希（PBKDF2，与原版 Electron 一致：10 万次迭代 SHA-512）
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
# 流式读取（feed.rs 响应体边读边计数，防内存炸弹）
futures-util = "0.3"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "blocking"] }
readability = "0.3.0"
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4"] }
# HTML 净化（阅读模式正文防 XSS）：基于 html5ever 真解析器，白名单模式，
# 替代原正则方案（正则可被 <svg/onload=> 等无闭合写法绕过）
ammonia = "4"
# URL 解析（ai.rs SSRF 防护：校验 base_url 协议/主机）
url = "2"
# 系统文件对话框（XDG portal，走 DBus，不依赖 GTK 主线程）
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
ksni = "0.3"
ts-rs = "10.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "=2.0", features = ["v2_40"] }
# 证书管理（P1-P3）：GTlsCertificate 的 subject_name/dns_names/ip_addresses/
# not_valid_before/after 都要 glib 2.70+（系统 glib 2.86），显式开 v2_70 特性
gio = { version = "0.18", features = ["v2_70"] }
# 网页截图（开放 API screenshot 命令）：webkit snapshot 返回 cairo::Surface；
# 写 PNG 需 cairo-rs 的 png feature（gtk 默认没开）
cairo-rs = { version = "0.18", features = ["png"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# 注意：不能 strip = true！Tauri 2 的 web extension（cdylib）需要保留符号，
# 否则 WebKit 找不到入口函数，tauri://localhost 协议失效，前端加载失败
strip = "debuginfo"
