# Dependabot 依赖更新（HANDOFF P2-4）
# 每周检查三生态更新，安全更新以 PR 形式提出，CI 的 audit 步骤自动复核
version: 2
updates:
  # Rust 依赖（Cargo.toml/Cargo.lock 在 src-tauri 下）
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
  # 前端依赖
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
  # GitHub Actions 版本（ci.yml 里的 uses）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
