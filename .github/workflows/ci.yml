name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: 前端 lint + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: 类型检查 + 构建
        run: npm run build

  backend:
    name: 后端 fmt + check + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 仓库根 rust-toolchain.toml 固定 1.97.1（含 clippy/rustfmt 组件），rustup 自动读文件
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: cargo fmt（格式不干净即失败）
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
      - name: cargo clippy（全目标 + 警告即失败）
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      # P2-1（2026-09-22）：生产代码 unwrap/expect 护栏（测试代码豁免）
      # 现有用法已在各模块 #![allow] 就地标注；此步防止**新增**未标注的 unwrap
      - name: cargo clippy（生产代码 unwrap 护栏）
        working-directory: src-tauri
        run: cargo clippy --lib -- -D clippy::unwrap_used -D clippy::expect_used
      - name: cargo test
        working-directory: src-tauri
        run: cargo test