name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  frontend:
    name: 前端 lint + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: ESLint
        run: npm run lint
      # P2-4 供应链：npm 依赖漏洞扫描（high+ 即失败）
      # 只审生产依赖：devDependencies（eslint 工具链）的 DoS 漏洞不进发布产物；
      # 且 braces 上游无修复版（3.0.3 为最新），全量审计会永久卡红（2026-10-21）
      - name: npm audit（仅生产依赖）
        run: npm audit --omit=dev --audit-level=high
      # R1-1（2026-09-25）：前端单测必须在 CI 执行——69+ vitest 用例（stores 状态机/
      # markdown XSS/invoke 契约）此前只在本地跑，回归可静默合入
      - name: Vitest 单元测试
        run: npm run test
      - name: 类型检查 + 构建
        run: npm run build
      # 首屏体积卡：入口 chunk raw 体积超限即拦（T-011，默认 90 kB，
      # 豁免清单 scripts/size-exemptions.json，仿 LINES-EXEMPT 机制）
      - name: 首屏体积检查
        run: bash scripts/check-bundle-size.sh

  backend:
    name: 后端 fmt + check + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 仓库根 rust-toolchain.toml 固定 1.97.1（含 clippy/rustfmt 组件），rustup 自动读文件
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      # resources/libshift_web_extension.so 被 .gitignore 排除（本地构建产物），
      # 但 tauri.conf.json 的 bundle.resources 强制引用它，CI checkout 后不存在 →
      # build.rs 报 "resource path ... doesn't exist" 直接失败。
      # CI 只验证编译/测试、不打包发布，占位文件即可（2026-10-21）
      - name: 占位 Web 扩展产物（CI 不打包，仅让 build.rs 通过）
        run: |
          mkdir -p src-tauri/resources
          touch src-tauri/resources/libshift_web_extension.so
      # tauri.conf.json 的 frontendDist 指向 ../dist，tauri 宏在编译期校验该路径存在。
      # 后端 job 不构建前端，占位目录即可（2026-10-21）
      - name: 占位前端产物（tauri 宏要求 frontendDist 存在）
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || echo '<!doctype html><title>ci</title>' > dist/index.html
      - name: cargo fmt（格式不干净即失败）
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
      - name: cargo clippy（全目标 + 警告即失败）
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      # P2-1（2026-09-22）：生产代码 unwrap/expect 护栏（测试代码豁免）
      # 现有用法已在各模块 #![allow] 就地标注；此步防止**新增**未标注的 unwrap
      - name: cargo clippy（生产代码 unwrap 护栏）
        working-directory: src-tauri
        run: cargo clippy --lib -- -D clippy::unwrap_used -D clippy::expect_used
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  security:
    name: 供应链审计（cargo-audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # P2-4：RustSec 公告扫描。忽略清单与评审理由在 src-tauri/audit.toml，
      # 新公告默认使本步失败；升级 tauri/gtk-rs 后须复核忽略项
      - name: 安装 cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit --color never

  static-checks:
    name: 静态一致性（文档/脚本防漂移）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 防 README 工具数/并发数手抄漂移：真值以 registry_tests.rs（48）与 feed.rs 信号量（6）为准
      - name: 脚本语法检查
        run: |
          bash -n scripts/smoke.sh
          bash -n scripts/backup.sh
          bash -n scripts/package-deb.sh
          bash -n scripts/check-rs-file-size.sh
          bash -n scripts/check-bundle-size.sh
          bash -n scripts/check-log-secrets.sh
      # 大文件红线卡：任意 .rs >400 行必须在文件头带 LINES-EXEMPT 豁免标记
      # （防 page.rs 式治理后反弹，2026-10-14 落地）
      - name: 大文件行数红线检查
        run: bash scripts/check-rs-file-size.sh
      # R4-10（2026-10-14）：日志密钥扫描——log:: 调用行含 token/password/secret 等
      # 敏感词时必须带 LOG-SECRET-EXEMPT 豁免注释，防止密钥意外泄漏到日志
      - name: 日志密钥扫描
        run: bash scripts/check-log-secrets.sh
      - name: 文档数字防漂移
        run: |
          test "$(grep -c '48 个工具' README.md)" -ge 1
          ! grep -q '25 工具' README.md
          ! grep -q '43 个工具' README.md
          ! grep -q '16 路并发' README.md
          grep -q 'Semaphore::new(6)' src-tauri/src/feed.rs
