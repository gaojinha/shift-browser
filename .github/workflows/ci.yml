name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: 前端 lint + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: 类型检查 + 构建
        run: npm run build

  backend:
    name: 后端 check + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: cargo check
        working-directory: src-tauri
        run: cargo check
      - name: cargo clippy（警告即失败）
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test